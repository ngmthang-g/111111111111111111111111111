[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tlmtool-clone"
version = "2.1.2"
description = "TLMTool 2.1.2 compatibility clone"
requires-python = ">=3.10,<3.11"
dependencies = ["Pillow==11.0.0", "psutil==6.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
